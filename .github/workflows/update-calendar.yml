name: 更新股票日历

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "generate_calendar.py"
      - "enhance_earnings.py"
      - "requirements.txt"
      - ".github/workflows/update-calendar.yml"

permissions:
  contents: write

concurrency:
  group: stock-calendar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python generate_calendar.py
      - run: python enhance_earnings.py
      - name: 提交更新后的日历
        run: |
          if git diff --quiet -- stocks.ics; then
            echo "日历没有变化。"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stocks.ics
            git commit -m "chore: update stock calendar"
            git push
          fi
