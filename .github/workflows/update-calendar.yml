name: Update stock calendar

on:
  schedule:
    - cron: "17 1 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-calendar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python generate_calendar.py
      - name: Commit updated calendar
        run: |
          if git diff --quiet -- stocks.ics; then
            echo "Calendar unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stocks.ics
            git commit -m "chore: update stock calendar"
            git push
          fi
